name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer push lands on the same ref. Cuts
# wall time on rapid push-on-push by ~30-60s of wasted CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `--reporter=json --outputFile` are extra flags on the run this job
      # already performs -- nothing executes twice, and no new job is needed
      # (#119). The report is what pins the README's count to what actually
      # ran; it said 49 against 492 real cases for as long as the sentence
      # existed, because the other two README locks pin quoted paths and the
      # D-NNN range and neither covers a number.
      - name: Run the toolkit suite, emitting a machine-readable report
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest-report.json
      - name: Verify the README's vitest count is what ran
        run: node tools/check-readme-test-count.mjs /tmp/vitest-report.json
      - run: npm run build
      - name: Job timing
        if: always()
        run: |
          echo "::notice title=toolkit duration::$(($SECONDS))s"
          echo "**toolkit:** \`${SECONDS}s\`" >> "$GITHUB_STEP_SUMMARY"

  example-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: example-app/package-lock.json
      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          # The .next/cache/ directory carries the Next build cache (SWC
          # transforms, webpack module graph). Keyed on the lockfile + every
          # source file so an unchanged tree gets a near-instant rebuild.
          path: example-app/.next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('example-app/package-lock.json') }}-${{ hashFiles('example-app/app/**', 'example-app/lib/**', 'example-app/components/**') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('example-app/package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-
      - name: Install example-app deps
        run: npm ci --prefix example-app
      - name: Build Next.js
        run: npm run build --prefix example-app
      - name: Test example-app routes (in-process, no real Anthropic)
        # Writes the JSON report the README check below reads. #121's Playwright
        # step "referenced a report its job never produces", so the producing
        # command and the consuming command name the same path here, and
        # `check-readme-test-count.test.mjs` asserts that they do.
        run: npm test --prefix example-app -- --reporter=json --outputFile=/tmp/example-app-report.json
      - name: Pin the README's example-app test and file counts
        # No `|| true` (#121): a step that cannot fail gates nothing, and there
        # is an arm asserting every invocation of this checker in this file is
        # unguarded.
        run: node tools/check-readme-test-count.mjs --example-app /tmp/example-app-report.json
      - name: Job timing
        if: always()
        run: |
          echo "::notice title=example-app duration::$(($SECONDS))s"
          echo "**example-app:** \`${SECONDS}s\`" >> "$GITHUB_STEP_SUMMARY"

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: example-app/package-lock.json
      - name: Install example-app deps
        run: npm ci --prefix example-app
      - name: Get Playwright version
        id: pw
        run: |
          v=$(node -e "console.log(require('./example-app/node_modules/@playwright/test/package.json').version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (skip if cache hit)
        # When the browser cache restores we still need the OS deps, which
        # are not in the cache; `--with-deps` is cheap when the browser
        # itself is already present.
        run: npx --prefix example-app playwright install --with-deps chromium
      - name: Cache Next.js build artifacts (Playwright job's own copy)
        uses: actions/cache@v4
        with:
          path: example-app/.next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('example-app/package-lock.json') }}-${{ hashFiles('example-app/app/**', 'example-app/lib/**', 'example-app/components/**') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('example-app/package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-
      - name: Build Next.js (production server is what Playwright targets)
        run: npm run build --prefix example-app
      - name: Run Playwright tests
        run: npm run test:e2e --prefix example-app
      # The README's "the 3 Playwright streaming tests" claim, pinned to what
      # Playwright itself lists (#121). This job is the only place the listing
      # exists, which is why the check takes it as an optional second argument
      # rather than trying to produce it from the root job.
      - name: Pin the README's Playwright count
        run: |
          # `cd example-app`, not `--prefix example-app`. `--prefix` changes npm's
          # package resolution and NOT the working directory, so from the repo root
          # Playwright finds no `playwright.config.ts`, picks up the ROOT's vitest
          # files instead, and reports 0 suites with 34 load errors -- exit 1 before
          # the checker even runs. Measured in CI and then reproduced locally (#121).
          ( cd example-app && npx playwright test --list --reporter=json ) \
            > /tmp/playwright-list.json
          node tools/check-readme-test-count.mjs --playwright /tmp/playwright-list.json
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: example-app/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Job timing
        if: always()
        run: |
          echo "::notice title=playwright duration::$(($SECONDS))s"
          echo "**playwright:** \`${SECONDS}s\` · pw-cache-hit=\`${{ steps.pw-cache.outputs.cache-hit || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"

  no-leaked-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject any committed cassette that still contains a sk- or Bearer token
        run: |
          set -euo pipefail
          if [ -d fixtures ]; then
            if grep -E -r --include="*.json" '\bsk-(ant-)?[A-Za-z0-9_-]{32,}\b' fixtures/ ; then
              echo "::error::A cassette contains an unredacted secret. Re-record after fixing redactHeaders()."
              exit 1
            fi
            if grep -E -r --include="*.json" '\bBearer[[:space:]]+[A-Za-z0-9._/+=-]{20,}\b' fixtures/ ; then
              echo "::error::A cassette contains a Bearer token."
              exit 1
            fi
          fi
          echo "no leaked secrets found in fixtures/"

  memory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify MEMORY directory exists and has required files
        run: |
          test -f MEMORY/full_history_ai.md
          test -f MEMORY/full_history_human.md
          test -f MEMORY/core_decisions_ai.md
          test -f MEMORY/core_decisions_human.md
      - name: Verify D-001 baseline decision exists
        run: |
          grep -q "id: D-001" MEMORY/core_decisions_ai.md
